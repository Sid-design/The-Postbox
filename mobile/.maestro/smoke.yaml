# Boot smoke test. The CI build sets EXPO_PUBLIC_E2E=1, so AuthContext seeds a
# stub session and the app launches straight into the main tab UI (bypassing
# Google OAuth, which Maestro can't drive). A visible tab bar proves the app
# booted and rendered — the regression that bit us before (CNG black screen).
appId: io.thepostbox.app
---
- launchApp:
    clearState: true
- assertVisible: "Mailbox"
- assertVisible: "Settings"
- takeScreenshot: app-booted
